version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: votesecure-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: votesecure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d votesecure']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - votesecure-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: votesecure-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@votesecure.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - votesecure-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  votesecure-network:
    driver: bridge
